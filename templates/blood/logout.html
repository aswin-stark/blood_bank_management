{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="3;url=/">
    <title>Logged out | Blood Bank Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
      :root { background: #20252d; color: #fff; font-family: 'DM Sans', sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; overflow: hidden; }
      .logout-screen { align-items: center; background: linear-gradient(135deg, #a81735, #e8324d 48%, #ff6472); display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
      .logout-screen::before, .logout-screen::after { border: 1px solid rgba(255, 255, 255, .2); border-radius: 50%; content: ''; position: absolute; }
      .logout-screen::before { animation: logout-ring-drift 9s ease-in-out infinite; height: 600px; right: -180px; top: -280px; width: 600px; }
      .logout-screen::after { animation: logout-ring-drift 12s ease-in-out infinite reverse; bottom: -320px; height: 680px; left: -210px; width: 680px; }
      .logout-brand { color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; left: 30px; position: absolute; top: 27px; z-index: 2; }
      .logout-brand i { margin-right: 8px; }
      .logout-cell { animation: logout-cell-float 7s ease-in-out infinite; background: rgba(255, 255, 255, .23); border: 2px solid rgba(255, 255, 255, .38); border-radius: 50%; box-shadow: 0 0 0 7px rgba(255, 255, 255, .06), 0 0 20px rgba(255, 255, 255, .3); height: 18px; position: absolute; width: 18px; }
      .logout-cell-a { left: 17%; top: 24%; }
      .logout-cell-b { animation-delay: -2s; height: 11px; right: 19%; top: 31%; width: 11px; }
      .logout-cell-c { animation-delay: -4s; bottom: 19%; right: 24%; height: 27px; width: 27px; }
      .logout-cell-d { animation-delay: -1s; bottom: 27%; left: 25%; height: 9px; width: 9px; }
      .logout-card { animation: logout-card-in .75s cubic-bezier(.2, .8, .2, 1) both; background: rgba(32, 37, 45, .93); border: 1px solid rgba(255, 255, 255, .23); border-radius: 22px; box-shadow: 0 28px 65px rgba(65, 9, 22, .35); max-width: 520px; padding: 52px 48px 46px; position: relative; text-align: center; width: calc(100% - 32px); z-index: 1; }
      .logout-icon { align-items: center; animation: logout-icon-pulse 2s ease-in-out infinite; background: linear-gradient(135deg, #ff6472, #ff9b8d); border-radius: 50%; box-shadow: 0 0 0 12px rgba(255, 100, 114, .12), 0 0 35px rgba(255, 100, 114, .45); color: #fff; display: flex; font-size: 32px; height: 82px; justify-content: center; margin: 0 auto 25px; width: 82px; }
      .logout-card .kicker { color: #ff9b8d; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
      .logout-card h1 { color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 30px; margin: 8px 0 10px; }
      .logout-card p { color: #cbd1d9; font-size: 14px; line-height: 1.6; margin: 0 auto 28px; max-width: 360px; }
      .logout-progress { background: rgba(255, 255, 255, .14); border-radius: 20px; height: 7px; margin: 0 auto 14px; overflow: hidden; width: 100%; }
      .logout-progress span { animation: logout-progress 3s linear forwards; background: linear-gradient(90deg, #ff6472, #ffb18d); border-radius: inherit; display: block; height: 100%; transform-origin: left; width: 100%; }
      .logout-countdown { color: #ffb18d; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
      @keyframes logout-card-in { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes logout-icon-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes logout-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes logout-cell-float { 0%, 100% { opacity: .35; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(25px, -20px) scale(1.15); } }
      @keyframes logout-ring-drift { 0%, 100% { transform: translate(0, 0) scale(.94); } 50% { transform: translate(-18px, 20px) scale(1.04); } }
      @media (max-width: 600px) { .logout-brand { font-size: 15px; left: 18px; top: 21px; } .logout-card { padding: 38px 24px 34px; } .logout-card h1 { font-size: 26px; } }
    </style>
  </head>
  <body>
    <main class="logout-screen">
      <div class="logout-brand"><i class="fas fa-heartbeat"></i> Blood Bank Management</div>
      <span class="logout-cell logout-cell-a"></span><span class="logout-cell logout-cell-b"></span><span class="logout-cell logout-cell-c"></span><span class="logout-cell logout-cell-d"></span>
      <section class="logout-card" aria-live="polite">
        <div class="logout-icon"><i class="fas fa-sign-out-alt"></i></div>
        <div class="kicker">Session complete</div>
        <h1>You have been logged out</h1>
        <p>Thank you for helping keep our blood bank community connected and caring.</p>
        <div class="logout-progress"><span></span></div>
        <div class="logout-countdown">Returning to home in <span id="logout-seconds">3</span> seconds</div>
      </section>
    </main>
    <script>
      (function () {
        var seconds = 3;
        var countdown = document.getElementById('logout-seconds');
        var timer = setInterval(function () {
          seconds -= 1;
          countdown.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(timer);
            window.location.replace('/');
          }
        }, 1000);
      }());
    </script>
  </body>
</html>
